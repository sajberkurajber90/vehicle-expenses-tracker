name: vehicle-expenses-tracker
services:
  reverse-proxy:
    image: nginx:1.29.0-alpine
    container_name: "vet-reverse-proxy"
    ports:
      - "80:80"
      - "${PROXY_PORT}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cert:/etc/nginx/ssl:ro
  api:
    build:
      context: ../..
      dockerfile: apps/api-core/Dockerfile.dev
    container_name: "vet-api"
    depends_on:
      - reverse-proxy
    develop:
      watch:
        - action: sync
          path: ../../apps/api-core/src
          target: /app/apps/api-core/src
        - action: rebuild
          path: ../../pnpm-lock.yaml
  ui-desktop:
#    environment:
    build:
      context: ../..
      dockerfile: apps/ui-desktop/Dockerfile.dev
    container_name: "vet-ui-desktop"
    depends_on:
      - reverse-proxy
      - api
    develop:
        watch:
          - action: sync
            path: ../../apps/ui-desktop/
            target: /app/apps/ui-desktop
            ignore:
              - node_modules
              - Dockerfile.dev
              - README.md
              - .nuxt
          - action: rebuild
            path: ../../pnpm-lock.yaml
  ui-mobile:
    build:
      context: ../..
      dockerfile: apps/ui-mobile/Dockerfile.dev
    container_name: "vet-ui-mobile"
    depends_on:
      - reverse-proxy
      - api
    develop:
        watch:
          - action: sync
            path: ../../apps/ui-mobile/
            target: /app/apps/ui-mobile
            ignore:
              - node_modules
              - Dockerfile.dev
              - README.md
              - .nuxt
          - action: rebuild
            path: ../../pnpm-lock.yaml