events {}

http {

    log_format debug_log '$remote_addr - $remote_user [$time_local] "$request"';
    access_log /var/log/nginx/access.log debug_log;

    map $host $service {
        "api.vehicle-expenses-tracker.local" "api:3000";
        default "";
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name .vehicle-expenses-tracker.local;

        ssl_certificate /etc/nginx/ssl/vehicle-expenses-tracker.local+1.pem;
        ssl_certificate_key /etc/nginx/ssl/vehicle-expenses-tracker.local+1-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        resolver 127.0.0.11 valid=30s;

        location / {
            if ($service = "") {
                return 404;
            }

            proxy_pass http://$service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
