events {}

## TODO: copy setup from fastify
http {

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$device_type"';

    map $host $service {
        "api.vehicle-expenses-tracker.local" "api:3000";
        "vehicle-expenses-tracker.local" "ui-desktop:3000";
        "m.vehicle-expenses-tracker.local" "ui-mobile:3000";
        default "";
    }

    map $http_user_agent $device_type {
        ~*(android|webos|iphone|ipod|blackberry|iemobile|windowsphone|operamini) "mobile";
        ~*(ipad|tablet|kindle|silk) "tablet";
        default "desktop";
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {

        listen 443 ssl;
        server_name api.vehicle-expenses-tracker.local;

        ssl_certificate /etc/nginx/ssl/vehicle-expenses-tracker.local+1.pem;
        ssl_certificate_key /etc/nginx/ssl/vehicle-expenses-tracker.local+1-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        resolver 127.0.0.11 valid=30s;


        location / {
            if ($service = "") {
                return 404;
            }

            proxy_pass http://$service;
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
            proxy_set_header Cookie              $http_cookie;
            proxy_set_header Origin                          $http_origin;
            proxy_set_header Access-Control-Request-Method   $http_access_control_request_method;
            proxy_set_header Access-Control-Request-Headers  $http_access_control_request_headers;

        }

    }

    server {
        listen 443 ssl;
        server_name vehicle-expenses-tracker.local;

        ssl_certificate /etc/nginx/ssl/vehicle-expenses-tracker.local+1.pem;
        ssl_certificate_key /etc/nginx/ssl/vehicle-expenses-tracker.local+1-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        resolver 127.0.0.11 valid=30s;
        access_log /var/log/nginx/access.log main;


        location / {
            if ($service = "") {
                return 404;
            }

            if ($device_type = "mobile") {
                return 302 https://m.vehicle-expenses-tracker.local$request_uri;
            }

            proxy_pass http://$service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # hot reload desktop
        location /_nuxt/hmr {
            proxy_pass http://ui-desktop:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

    }

    server {
        listen 443 ssl;
        server_name m.vehicle-expenses-tracker.local;

        ssl_certificate /etc/nginx/ssl/vehicle-expenses-tracker.local+1.pem;
        ssl_certificate_key /etc/nginx/ssl/vehicle-expenses-tracker.local+1-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        resolver 127.0.0.11 valid=30s;
        access_log /var/log/nginx/access.log main;

        location / {
            if ($service = "") {
                return 404;
            }

            if ($device_type != "mobile") {
                return 302 https://vehicle-expenses-tracker.local$request_uri;
            }

            proxy_pass http://$service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /_nuxt/m/hmr {
            proxy_pass http://ui-mobile:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
